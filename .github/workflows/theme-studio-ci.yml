name: Theme Studio v1.0 CI

on:
  push:
    branches: [main]
    paths:
      - "theme-studio/**"
      - "design/themes/celestial-library/**"
      - ".github/workflows/theme-studio-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check theme-studio/server.mjs
          node --check theme-studio/app.js
          python -m py_compile tools/theme-kit/kit.py
          python -m py_compile tools/theme-kit/make_slots.py
      - name: Start Theme Studio
        run: |
          node theme-studio/server.mjs > /tmp/theme-studio.log 2>&1 &
          echo $! > /tmp/theme-studio.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4177/api/themes >/tmp/themes.json && break; sleep 1; done
          cat /tmp/themes.json
          curl -fsS http://127.0.0.1:4177/api/session >/tmp/session.json
          python - <<'PY'
          import json
          print(json.load(open('/tmp/session.json'))['token'])
          PY
      - name: Verify Celestial Library pilot
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/themes.json','utf8'));
          const p=j.themes.find(x=>x.id==='celestial-library');
          if(!p)throw Error('celestial-library pilot missing');
          if(!['MOOD','TARGET','ASSETS','BACKGROUNDS','BUILD','QA','READY','RELEASED'].includes(p.computedStage))throw Error('invalid pilot stage '+p.computedStage);
          if(!p.migration?.missingArtifacts?.includes('original-approved-concept-image'))throw Error('missing legacy artifact not tracked');
          console.log(JSON.stringify({pilot:'passed',stage:p.computedStage,version:p.projectVersion}));
          NODE
      - name: Export self-contained project
        run: |
          TOKEN=$(python -c "import json;print(json.load(open('/tmp/session.json'))['token'])")
          curl -fsS -H "X-Theme-Studio-Token: $TOKEN" -X POST http://127.0.0.1:4177/api/themes/celestial-library/export -o /tmp/celestial-library.ggrid-theme-project || { cat /tmp/theme-studio.log; exit 1; }
          python - <<'PY'
          import zipfile,json
          p='/tmp/celestial-library.ggrid-theme-project'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert 'project.json' in names
              assert 'manifest.json' in names
              assert 'theme-kit.json' in names
              assert 'legacy-runtime/content/themes/celestial-library/theme.json' in names
              assert 'legacy-runtime/content/themes/celestial-library/artwork/hf-atlas.webp' in names
              m=json.loads(z.read('manifest.json'))
              assert m['themeId']=='celestial-library'
              print({'themeProjectExport':'passed','files':len(names)})
          PY
      - name: Stop Theme Studio
        if: always()
        run: kill $(cat /tmp/theme-studio.pid) || true
