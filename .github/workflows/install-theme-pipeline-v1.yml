name: Install Theme Pipeline v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-theme-pipeline-v1.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Theme Pipeline sources
        env:
          BUNDLE: 
        run: |
          echo "$BUNDLE" | base64 -d > /tmp/theme-pipeline-src.tgz
          tar -xzf /tmp/theme-pipeline-src.tgz
      - name: Install template tooling
        run: |
          pip install --quiet pillow numpy scipy playwright
          python -m playwright install --with-deps chromium
      - name: Generate templates
        run: |
          python tools/theme-kit/kit.py templates
          python tools/theme-kit/kit.py scaffold --theme classic
      - name: Self-test
        run: |
          python tools/theme-kit/test_kit.py
          node tools/test-theme-autotile.mjs
      - name: Commit Theme Pipeline
        run: |
          git config user.name "ggrid-theme-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add tools/theme-kit tools/test-theme-autotile.mjs js/theme-autotile.js docs/THEME-KIT.md docs/THEME-PIPELINE-V1.md design/themes/README.md .github/workflows/theme-kit.yml .github/workflows/theme-templates.yml
          git commit -m "v0.15.35: install Theme Pipeline v1 sources and templates"
          git pull --rebase origin main
          git push origin main
