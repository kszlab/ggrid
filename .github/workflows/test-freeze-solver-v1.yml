name: Freeze Solver focused tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-freeze-solver-v1.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check js/freeze-solver-v1.js
      - run: node --check js/freeze-solver-v2.js
      - run: node tools/test-freeze-solver-v1.mjs
      - run: node tools/test-freeze-solver-v2.mjs

# v0.15.34 focused v2 validation
