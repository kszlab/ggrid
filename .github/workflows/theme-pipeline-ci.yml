name: Theme Pipeline v3 CI

on:
  push:
    branches: [main]
    paths:
      - "tools/theme-kit/**"
      - "tools/test-theme-pipeline-v1.py"
      - "js/theme-autotile.js"
      - "tools/test-theme-autotile.mjs"
      - ".github/workflows/theme-pipeline-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Syntax and schema
        run: |
          python -m py_compile tools/theme-kit/kit.py tools/theme-kit/make_slots.py
          python tools/test-theme-pipeline-v1.py
          node tools/test-theme-autotile.mjs
      - name: Generate templates
        run: python tools/theme-kit/kit.py templates
      - name: Build synthetic strict theme end to end
        run: |
          mkdir -p design/themes/ci-theme
          python - <<'PY'
          from PIL import Image,ImageDraw
          import json,os
          p='design/themes/ci-theme'
          spec=json.load(open('tools/theme-kit/slots.json',encoding='utf-8'))
          for n in ['mood.png','target.png']:
              im=Image.new('RGB',(1024,1536),(20,30,50));ImageDraw.Draw(im).ellipse((350,550,674,874),fill=(220,180,80));im.save(p+'/'+n)
          packs={}
          for pid,pk in spec['packs'].items():
              packs[pid]=Image.new('RGB',tuple(pk['size']),(255,0,255))
          for i,s in enumerate(spec['slots']):
              if not s.get('pack'): continue
              x,y,w,h=s['packBox'];im=packs[s['pack']];d=ImageDraw.Draw(im)
              pad=max(18,min(w,h)//8)
              fill=(70+(i*17)%150,80+(i*23)%130,120+(i*11)%120)
              d.rounded_rectangle((x+pad,y+pad,x+w-pad,y+h-pad),radius=max(8,pad//2),fill=fill,outline=(245,195,75),width=max(3,pad//6))
          for pid,pk in spec['packs'].items():
              packs[pid].save(f"{p}/{pk['file']}")
          Image.new('RGB',(1080,1620),(18,28,52)).save(p+'/bg-portrait.png')
          Image.new('RGB',(1620,1080),(18,28,52)).save(p+'/bg-landscape.png')
          json.dump({'id':'ci-theme','name':'CI Theme','description':'Theme Pipeline CI','strict':True},open(p+'/theme-kit.json','w'))
          PY
          python tools/theme-kit/kit.py approve --input design/themes/ci-theme --stage mood --actor ci
          python tools/theme-kit/kit.py approve --input design/themes/ci-theme --stage target --actor ci
          python tools/theme-kit/kit.py extract-packs --input design/themes/ci-theme
          test -f design/themes/ci-theme/extracted/cell-1.png
          python tools/theme-kit/kit.py approve --input design/themes/ci-theme --stage sheets --actor ci
          python tools/theme-kit/kit.py approve --input design/themes/ci-theme --stage backgrounds --actor ci
          python tools/theme-kit/kit.py build --input design/themes/ci-theme
          test -f content/themes/ci-theme/theme.json
          test -f content/themes/ci-theme/raster/rigid-tiles-ring.webp
          test -f content/themes/ci-theme/raster/button-square.webp
          test -f content/themes/ci-theme/raster/score-box.webp
          test -f content/themes/ci-theme/approval.json
