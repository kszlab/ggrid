name: Refresh rigid shape catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-rigid-shapes.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh shape catalog
        run: node tools/scan-rigid-shapes.mjs
      - name: Refresh theme coverage audit
        run: node tools/audit-theme-shapes.mjs
      - name: Verify
        run: |
          node tools/scan-rigid-shapes.mjs --check
          node tools/audit-theme-shapes.mjs --check
      - name: Commit
        run: |
          git config user.name "ggrid-shapes"
          git config user.email "actions@users.noreply.github.com"
          git add content/shapes/rigid-shapes.json tools/theme-shape-audit.json
          git commit -m "v0.15.30: refresh rigid shape catalog and theme audit"
          git pull --rebase origin main
          git push origin main
