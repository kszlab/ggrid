name: Rigid shape checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  pull_request:

jobs:
  rigid-shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check js/theme-visuals.js
          node --check js/theme-assets.js
          node --check js/theme-layout.js
          node --check js/theme-frame.js
          node --check js/scene-renderer.js
          node --check js/main.js
          node --check js/scenario-loader.js
      - name: Test classifier
        run: node tools/test-rigid-shapes.mjs
      - name: Theme Visuals V3
        run: node tools/test-theme-visuals.mjs
      - name: Artwork Theme Assets
        run: node tools/test-theme-assets-v2.mjs
      - name: Artwork Theme Layout
        run: node tools/test-theme-layout.mjs
      - name: Artwork Theme Frame
        run: node tools/test-theme-frame.mjs
      - name: Celestial Library artwork contract
        run: node tools/test-celestial-artwork.mjs
      - name: Verify shape catalog
        run: node tools/scan-rigid-shapes.mjs --check
      - name: Verify theme coverage audit
        run: node tools/audit-theme-shapes.mjs --check
      - name: Theme asset integrity
        run: node tools/test-theme-assets.mjs
