name: GGrid validation

on:
  # Direct main development creates several small technical commits. Run the
  # full suite only when the application version is finalized in index.html,
  # instead of emailing for every intermediate commit.
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/rigid-shapes.yml"

  # Pull requests still get full automatic validation when relevant code,
  # content, tests or styles change.
  pull_request:
    paths:
      - "js/**"
      - "content/**"
      - "tools/**"
      - "css/**"
      - "index.html"
      - ".github/workflows/rigid-shapes.yml"

  # Allows an explicit full check from GitHub Actions when needed.
  workflow_dispatch:

# If a newer validation starts for the same branch/PR, do not keep an obsolete
# run alive. This prevents duplicate failure notifications during rapid edits.
concurrency:
  group: ggrid-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check js/theme-visuals.js
          node --check js/theme-assets.js
          node --check js/theme-layout.js
          node --check js/theme-frame.js
          node --check js/scene-renderer.js
          node --check js/main.js
          node --check js/scenario-loader.js
          node --check js/solver.js
          node --check js/level-library.js
          node --check js/generated-test-library.js
          node --check tools/generate-levels-v2.mjs
          node --check tools/level-generator-v2/worker.mjs
          node --check tools/generate-levels-v3.mjs
          node --check tools/level-generator-v3/layout.mjs
          node --check tools/level-generator-v3/statespace.mjs
          node --check tools/level-generator-v3/worker.mjs
      - name: Runtime solver equivalence
        run: node tools/test-runtime-solver.mjs
      - name: Fast Generator v2 smoke test
        run: node tools/test-level-generator-v2.mjs
      - name: Fast Generator v3 regression test
        run: node tools/test-level-generator-v3.mjs
      - name: Level Metadata v3
        run: node tools/verify-level-metadata-v3.mjs
      - name: Test classifier
        run: node tools/test-rigid-shapes.mjs
      - name: Theme Visuals V3
        run: node tools/test-theme-visuals.mjs
      - name: Artwork Theme Assets
        run: node tools/test-theme-assets-v2.mjs
      - name: Artwork Theme Layout
        run: node tools/test-theme-layout.mjs
      - name: Artwork Theme Frame
        run: node tools/test-theme-frame.mjs
      - name: Celestial Library artwork contract
        run: node tools/test-celestial-artwork.mjs
      - name: Verify shape catalog
        run: node tools/scan-rigid-shapes.mjs --check
      - name: Verify theme coverage audit
        run: node tools/audit-theme-shapes.mjs --check
      - name: Theme asset integrity
        run: node tools/test-theme-assets.mjs

